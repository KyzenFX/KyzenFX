.page{width:min(100%,820px);min-height:100vh;margin:auto;padding:30px 28px 38px;position:relative}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:92px}
.top-icon{width:60px;height:60px;border:2px solid rgba(255,255,255,.3);border-radius:20px;display:grid;place-items:center;background:rgba(0,0,0,.28);backdrop-filter:blur(8px);font-size:30px}
.profile{text-align:center}
.avatar{width:205px;height:205px;border-radius:50%;margin:0 auto 28px;overflow:hidden;border:4px solid rgba(0,110,255,.8);box-shadow:0 0 30px rgba(0,110,255,.65),0 0 70px rgba(0,180,255,.2);background:#111}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center 48%;transform:scale(1.03)}
.handle{font-size:44px;font-weight:800;letter-spacing:-1px;margin:0;text-shadow:0 2px 15px #000}
.tagline{font-size:21px;font-weight:600;margin:10px 0 58px;letter-spacing:.5px;text-shadow:0 2px 12px #000}
.links{display:flex;flex-direction:column;gap:22px}
.link{min-height:128px;border-radius:70px;background:rgba(65,65,70,.86);border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 28px rgba(0,0,0,.3);color:#fff;text-decoration:none;display:flex;align-items:center;padding:13px 23px 13px 15px;backdrop-filter:blur(10px);transition:.15s}
.link:active{transform:scale(.985)}
.link:hover{background:rgba(78,78,85,.93)}
.link-icon{width:100px;height:100px;flex:0 0 100px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:#050505;border:2px solid rgba(0,130,255,.65);font-weight:900}
.link-icon img{width:100%;height:100%;object-fit:cover}
.kx-text{font-size:25px;background:linear-gradient(135deg,#fff,#08aaff);-webkit-background-clip:text;color:transparent}
.link-text{flex:1;text-align:center;padding:0 15px}
.link-title{font-size:23px;font-weight:700;line-height:1.18}
.link-sub{font-size:17px;color:#ddd;margin-top:7px}
.dots{font-size:28px;color:#ddd;width:18px}
.join{margin:125px 5px 60px;height:104px;border-radius:60px;background:#fff;color:#050505;display:grid;place-items:center;text-decoration:none;font-size:24px;font-weight:700;text-align:center;padding:0 20px;box-shadow:0 8px 35px rgba(0,100,255,.2)}
.footer{text-align:center;font-size:17px;line-height:1.65;text-shadow:0 2px 10px #000}
@media(max-width:600px){
.page{padding-left:22px;padding-right:22px}
.topbar{margin-bottom:86px}
.avatar{width:185px;height:185px}
.handle{font-size:39px}
.tagline{font-size:18px;margin-bottom:50px}
.link{min-height:118px;padding-right:18px}
.link-icon{width:88px;height:88px;flex-basis:88px}
.link-title{font-size:20px}
.link-sub{font-size:15px}
.join{margin-top:105px;font-size:21px}
}

/* KyzenFX compact layout */
.page{width:min(100%,680px);padding:22px 20px 30px}
.topbar{margin-bottom:52px}
.top-icon{width:48px;height:48px;border-radius:16px;font-size:24px}
.avatar{width:155px;height:155px;margin-bottom:20px}
.handle{font-size:34px;letter-spacing:-.5px}
.links{gap:14px}
.link{min-height:88px;border-radius:48px;padding:10px 17px 10px 11px}
.link-icon{width:68px;height:68px;flex-basis:68px}
.kx-text{font-size:20px}
.link-text{padding:0 10px}
.link-title{font-size:18px}
.link-sub{font-size:13px;margin-top:4px}
.dots{font-size:24px;width:14px}
.join{margin:72px 4px 42px;height:76px;border-radius:42px;font-size:19px;padding:0 16px}
.footer{font-size:14px}
@media(max-width:600px){
  .page{padding:18px 16px 26px}
  .topbar{margin-bottom:46px}
  .avatar{width:145px;height:145px}
  .handle{font-size:32px}
  .link{min-height:82px;padding-right:14px}
  .link-icon{width:62px;height:62px;flex-basis:62px}
  .link-title{font-size:17px}
  .link-sub{font-size:12px}
  .join{margin-top:62px;height:70px;font-size:18px}
}
